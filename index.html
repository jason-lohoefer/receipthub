<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReceiptHub | Travel expenses made clear</title><style>:root{font-family:Arial,sans-serif;color:#152238;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1040px;margin:auto;padding:28px}header{background:#142d50;color:white;padding:18px 30px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:800}.logo span{color:#67dbbf}nav button{background:transparent;border:0;color:white;cursor:pointer;padding:10px}h1{font-size:30px;margin-bottom:8px}p{color:#58677c;line-height:1.5}.muted{color:#63758b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.card,.panel{background:white;border:1px solid #dce4ef;border-radius:13px;padding:22px;box-shadow:0 2px 7px #102a4510}.metric{font-size:28px;font-weight:800;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{background:#1769bb;border:0;border-radius:8px;color:white;padding:12px 18px;cursor:pointer;font-weight:700}.btn.alt{background:white;color:#1769bb;border:1px solid #abc7e5}.btn:focus{outline:3px solid #91c9ff}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #e8edf4}.row:last-child{border:0}.tag{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#e2f5ec;color:#146b48}.tag.warn{background:#fff0d6;color:#9b5b00}.tag.bad{background:#ffe6e4;color:#a43c32}input,select{padding:12px;border:1px solid #b9c9da;border-radius:8px;font:inherit;width:100%}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.hidden{display:none}.step{font-size:13px;font-weight:700;color:#1769bb;letter-spacing:.07em;text-transform:uppercase}.hint{padding:14px;background:#eaf4ff;border-left:4px solid #1769bb;border-radius:7px;color:#254b6f;margin:18px 0}.receipt{border:2px dashed #b6c8da;border-radius:12px;padding:25px;text-align:center;background:#fafcff}.foot{margin:35px 0;color:#748396;font-size:12px}@media(max-width:650px){.cards,.grid,.formgrid{grid-template-columns:1fr}.shell{padding:18px}header{padding:15px}.logo{font-size:19px}}</style></head><body><header><div class="logo">▣ Receipt<span>Hub</span></div><nav><button onclick="go('dashboard')">Trips</button><button onclick="go('report')">Report</button></nav></header><main class="shell"><div id="app"></div><div class="foot">ReceiptHub concept prototype · Sample data only · No employer integration or automatic OCR</div></main><script>
const initial=[{id:1,merchant:'Airport Parking',date:'2026-11-18',amount:28.00,category:'Transportation',receipt:true},{id:2,merchant:'Hotel Dinner',date:'2026-11-18',amount:42.65,category:'Meals',receipt:true},{id:3,merchant:'Taxi to Client',date:'2026-11-19',amount:24.50,category:'Transportation',receipt:false},{id:4,merchant:'Coffee Shop',date:'2026-11-19',amount:8.75,category:'Meals',receipt:true}];let expenses=JSON.parse(localStorage.getItem('rh-expenses')||'null')||initial;let draft={};let page='dashboard';const app=document.getElementById('app');const money=n=>'$'+Number(n).toFixed(2);const total=()=>expenses.reduce((s,x)=>s+Number(x.amount),0);const missing=()=>expenses.filter(x=>!x.receipt).length;function save(){localStorage.setItem('rh-expenses',JSON.stringify(expenses))}function go(p){page=p;render();window.scrollTo(0,0)}function header(title,sub,step){return `<div class="step">${step}</div><h1>${title}</h1><p>${sub}</p>`}function row(x){return `<div class="row"><div><b>${x.merchant}</b><div class="muted" style="font-size:13px;margin-top:5px">${x.date} · ${x.category}</div></div><div style="text-align:right"><b>${money(x.amount)}</b><div style="margin-top:7px"><span class="tag ${x.receipt?'':'warn'}">${x.receipt?'Receipt saved':'Receipt missing'}</span></div></div></div>`}function render(){let h='';if(page==='dashboard'){h=header('Your travel expenses','Everything from your business trip in one place.','01 · Trips dashboard')+`<div class="cards"><div class="card">Trip total<div class="metric">${money(total())}</div></div><div class="card">Recorded expenses<div class="metric">${expenses.length}</div></div><div class="card">Needs attention<div class="metric">${missing()}</div></div></div><div class="panel"><h2>Phoenix work trip</h2><p>November 18–20, 2026 · Phoenix, Arizona</p><div class="hint">${missing()?`${missing()} expense(s) need a receipt before your trip is ready.`:'All recorded expenses have receipts. Ready for final review.'}</div><button class="btn" onclick="go('trip')">Open trip →</button></div>`}else if(page==='trip'){h=header('Phoenix work trip','Review each purchase and identify anything missing.','02 · Trip expense list')+`<div class="actions"><button class="btn" onclick="go('add')">+ Add receipt or expense</button><button class="btn alt" onclick="go('report')">Review report →</button></div><div class="panel"><h2>Expenses <span class="muted">(${expenses.length})</span></h2>${expenses.map(row).join('')}</div><div class="hint">${missing()?`Action needed: ${missing()} expense(s) have no receipt. You can add one or continue with the missing-receipt flag.`:'No missing receipts detected among recorded expenses. Compare this list with your actual purchases before submitting.'}</div>`}else if(page==='add'){h=header('Add an expense','Capture the details while the purchase is fresh.','03 · Add receipt')+`<div class="panel"><div class="receipt"><b>Receipt attachment</b><p>Choose a photo or PDF (optional for this demo)</p><input type="file" id="file" accept="image/*,.pdf"></div><div class="formgrid"><div><label for="merchant">Merchant</label><input id="merchant" value="Airport Lunch"></div><div><label for="amount">Amount (USD)</label><input id="amount" type="number" min="0.01" step="0.01" value="18.40"></div><div><label for="date">Purchase date</label><input id="date" type="date" value="2026-11-19"></div><div><label for="category">Category</label><select id="category"><option>Meals</option><option>Transportation</option><option>Lodging</option><option>Other</option></select></div></div><div class="hint">This concept demo uses editable sample fields. Automatic receipt scanning is proposed for future development, not implemented here.</div><div class="actions"><button class="btn" onclick="review()">Review details →</button><button class="btn alt" onclick="go('trip')">Cancel</button></div></div>`}else if(page==='review'){h=header('Verify expense details','Check the information before adding it to your trip.','04 · Review and save')+`<div class="panel"><div class="row"><b>Merchant</b><span>${esc(draft.merchant)}</span></div><div class="row"><b>Amount</b><span>${money(draft.amount)}</span></div><div class="row"><b>Date</b><span>${draft.date}</span></div><div class="row"><b>Category</b><span>${draft.category}</span></div><div class="row"><b>Receipt</b><span class="tag ${draft.receipt?'':'warn'}">${draft.receipt?'Attached':'Not attached'}</span></div><div class="actions"><button class="btn" onclick="commit()">Save to trip ✓</button><button class="btn alt" onclick="go('add')">Edit details</button></div></div>`}else if(page==='report'){h=header('Trip expense report','Review your trip and prepare a file for your company expense system.','05 · Review and export')+`<div class="cards"><div class="card">Total<div class="metric">${money(total())}</div></div><div class="card">Expenses<div class="metric">${expenses.length}</div></div><div class="card">Missing receipts<div class="metric">${missing()}</div></div></div><div class="panel"><h2>Phoenix · November 18–20</h2>${expenses.map(row).join('')}<div class="hint">${missing()?'Some receipts are missing. Export is available with those items flagged for follow-up.':'All recorded expenses have receipts. Confirm no purchases are missing before export.'}</div><div class="actions"><button class="btn" onclick="exportCsv()">Download CSV report ↓</button><button class="btn alt" onclick="go('trip')">Back to expenses</button><button class="btn alt" onclick="reset()">Reset sample data</button></div></div>`}app.innerHTML=h}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function review(){let m=document.getElementById('merchant').value.trim(),a=Number(document.getElementById('amount').value),d=document.getElementById('date').value;if(!m||!(a>0)||!d){alert('Enter a merchant, valid amount, and date.');return}draft={merchant:m,amount:a,date:d,category:document.getElementById('category').value,receipt:document.getElementById('file').files.length>0};go('review')}function commit(){expenses.push({...draft,id:Date.now()});save();go('trip')}function exportCsv(){let lines=[['Merchant','Date','Amount','Category','Receipt attached'],...expenses.map(x=>[x.merchant,x.date,x.amount,x.category,x.receipt?'Yes':'No'])];let csv=lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ReceiptHub-Phoenix-Trip.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function reset(){if(confirm('Restore original demo expenses?')){expenses=initial;save();go('dashboard')}}render();</script></body></html>
